<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تسجيل بيانات الناخب</title>
<style>
:root{--bg:#f3f7f6;--c:#fff;--t:#1f2a2a;--m:#6a7d7c;--b:#d6e2e0;--p:#0b5b5b;--pt:#fff;--d:#8f1c20;--pl:#e4f0ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#101a1a;--c:#182424;--t:#e6efee;--m:#95aaa8;--b:#2b3d3c;--p:#3aa59f;--pt:#062524;--d:#e2706f;--pl:#1e3331}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
.w{max-width:720px;margin:auto;padding:12px}h1{font-size:18px;text-align:center;color:var(--p);margin:6px 0}h3{margin:14px 0 6px;font-size:15px;color:var(--p)}
.card{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:14px;margin-bottom:10px}
input,select,textarea,button{font:inherit;font-size:16px;color:var(--t);background:var(--c);border:1px solid var(--b);border-radius:10px;padding:9px;width:100%}
button{width:auto;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.5}.pr{background:var(--p);color:var(--pt);border-color:var(--p)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}@media(max-width:520px){.g,.g3{grid-template-columns:1fr}}
label{font-size:12px;color:var(--m);display:block;margin-top:6px}label.rq::after{content:" *";color:var(--d)}
.msg{padding:8px;border-radius:10px;background:var(--pl);border:1px solid var(--b);font-size:13px;color:var(--m);margin-top:8px}.msg.bad{background:transparent;border-color:var(--d);color:var(--d);font-weight:600}.msg.ok{background:#eaf9ef;border-color:#9bd0a7;color:#1d6a3c}.hide{display:none!important}
.brand{text-align:center;margin:6px 0 10px}.brand img{width:84px;height:84px;object-fit:contain;border-radius:22px;background:#fff;border:2px solid var(--p);padding:6px;margin:0 6px}.brand small{display:block;color:var(--m);margin-top:6px}
.dr{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0;padding:8px;border:1px solid var(--b);border-radius:10px}.dr b{flex:1;min-width:120px;font-size:14px}.dc{background:var(--pl);border:1px solid var(--b);border-radius:10px;padding:8px;display:inline-block;font-size:12px;color:var(--m)}
.btn{display:inline-block;padding:8px 12px;border:1px solid var(--b);border-radius:10px;cursor:pointer;font-size:13px;position:relative;overflow:hidden}.btn input{position:absolute;inset:0;opacity:0;width:100%;height:100%}.im{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.im div{position:relative}.im img{width:78px;height:78px;object-fit:cover;border-radius:8px;border:1px solid var(--b)}.im i{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.6);color:#fff;border-radius:20px;padding:2px 6px;font-size:10px;font-style:normal;cursor:pointer}.pdf{display:inline-block;padding:20px 8px;border:1px solid var(--b);border-radius:8px;font-size:12px}
</style></head><body><div class="w" id="app"><div class="msg">جارٍ التحميل…</div></div>
<script>
(function(){
const GAS_URL="" /* ضع هنا رابط Apps Script (…/exec) أو مرّره في الرابط: ?g=الرابط */;
const LOGO="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAMCAgMCAgMDAwMEAwMEBQgFBQQEBQoHBwYIDAoMDAsKCwsNDhIQDQ4RDgsLEBYQERMUFRUVDA8XGBYUGBIUFRT/2wBDAQMEBAUEBQkFBQkUDQsNFBQUFBQUFBQUFBQUFBQUF[...";
const FLAG="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAJAAAAB7CAYAAAAF...";
const GOV={"بيروت":["بيروت"],"جبل لبنان":["بعبدا","المتن","عاليه","الشوف","كسروان","جبيل"],"الشمال":["طرابلس","زغرتا","الكورة","المنية","البترون","قضاء الشمال"],"النبطية":["النبطية","مرجعيون","حاصبيا","زحلة","راشيا","بنت جبيل"],"البقاع":["زحلة","بعلبك","راشيا","الهرمل","النبطية"],"الجنوب":["صيدا","صور","جبيل","النبطية"],"عكار":["طرابلس","عرمون","المنية"],"بعلبك الهرمل":["بعلبك","الهرمل"],"عكار":["عرمون"],"بيروت": ["بيروت"]};
const REQ=[["fn","الاسم"],["fa","اسم الأب"],["mo","اسم الأم وشهرتها"],["ln","الشهرة / العائلة"],["dob","تاريخ الولادة"],["sx","الجنس"],["sect","الطائفة"],["g","الوضع الاجتماعي"],["nid","رقم الهوية"],["reg","رقم القيد"],["city","المدينة"],["zone","المنطقة"],["addr","عنوان السكن"],["mob","رقم الهاتف"]];
const $=s=>document.querySelector(s),E=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const opts=(a,v)=>a.map(x=>`<option ${x==v?"selected":""}>${E(x)}</option>`).join("");
const norm=s=>String(s==null?"":s).normalize("NFKC").replace(/[\u064B-\u0652\u0640]/g,"").replace(/[أإآٱ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/[٠-٩]/g,c=>"٠١٢٣٤٥٦٧٨٩"["0123456789".indexOf(c)]).replace(/\s+/g," ").trim();
const H=s=>{let a=5381,b=52711;for(const c of String(s)){const p=c.codePointAt(0);a=((a*33)^p)>>>0;b=(b*31+p)|0}return a.toString(36)+(b>>>0).toString(36)};
const age=s=>{const b=new Date(s);if(isNaN(b))return null;const n=new Date();let a=n.getFullYear()-b.getFullYear();const m=n.getMonth()-b.getMonth();if(m<0||(m==0&&n.getDate()<b.getDate()))a--;return a};
function regKeys(d,y){const k=[],n=norm(d.nid).replace(/ /g,"");if(n)k.push("n"+H(y+"|"+n));if(d.reg&&d.fn&&d.ln)k.push("r"+H(y+"|"+norm(d.reg)+"|"+norm(d.fn)+"|"+norm(d.ln)));return k}
const P=new URLSearchParams(location.search);let URLX=window.__GAS||P.get("g")||GAS_URL;
const hasGS=()=>{try{return typeof google!="undefined"&&!!google.script&&!!google.script.run&&typeof google.script.run.rpc=="function"}catch(e){return false}};
const viaGS=r=>new Promise((ok,no)=>{const tm=setTimeout(()=>no(new Error("gs-timeout")),r.op=="upload"?120000:45000);google.script.run.withSuccessHandler(s=>{clearTimeout(tm);try{const x=JSON.parse(s);ok(x)}catch(e){ok(s)}}).withFailureHandler(e=>{clearTimeout(tm);no(e)}).call(r.op,r);});
const viaFetch=async r=>{if(!URLX)throw new Error("رابط Apps Script غير مضبوط");const ac=window.AbortController?new AbortController():null,tm=setTimeout(()=>{if(ac)ac.abort()},r.op=="upload"?120000:45000);try{const res=await fetch(URLX,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(r),signal:ac?ac.signal:null});const txt=await res.text();let data;try{data=JSON.parse(txt)}catch(e){data=txt};if(!res.ok)throw new Error((data&&data.error)||txt||"request failed");return data}catch(e){if(ac&&e.name=="AbortError")throw new Error("انتهت مهلة الاتصال");throw e}finally{clearTimeout(tm)}}};
const call=async r=>{if(hasGS()){try{return await viaGS(r)}catch(e){if(e&&e.srv)throw e}}return viaFetch(r)};
const loadImg=f=>typeof createImageBitmap=="function"?createImageBitmap(f).catch(()=>li2(f)):li2(f);
const li2=f=>new Promise((ok,no)=>{const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{URL.revokeObjectURL(u);ok(i)};i.onerror=()=>{URL.revokeObjectURL(u);no(new Error("تعذر قراءة الملف"))};i.src=u});
const toB64=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(",")[1]);r.onerror=()=>no(new Error("تعذر قراءة الملف"));r.readAsDataURL(f)});
async function prep(f){if(!/^image\/(jpeg|png|webp)/.test(f.type))return{b:f,name:f.name,mime:f.type};try{const bm=await loadImg(f),k=Math.min(1,1600/Math.max(bm.width,bm.height)),c=document.createElement("canvas"),ctx=c.getContext("2d");c.width=Math.max(1,Math.round(bm.width*k));c.height=Math.max(1,Math.round(bm.height*k));ctx.drawImage(bm,0,0,c.width,c.height);return{b:await new Promise(res=>c.toBlob(blob=>res(blob||f),f.type,0.82)),name:f.name,mime:f.type};}catch(e){return{b:f,name:f.name,mime:f.type}}}
async function upload(f,type){if(f.size>15e6)throw new Error("الحجم أكبر من 15 ميغابايت");const p=await prep(f),x=await call({op:"upload",name:p.name,mime:p.mime,b64:await toB64(p.b),type});return x&&x.url?x.url:x;}
let cur={vs:"مقيم"},imgs=[],year=new Date().getFullYear();
const fld=(k,l,t)=>`<div><label class="rq">${l}</label><input name="${k}" type="${t||"text"}"></div>`;
const loc=(p,l,rq)=>`<h3>${l}</h3><div class="g3"><div><label class="${rq?"rq":""}">المحافظة</label><select name="${p}g" data-p="${p}">${opts(["",...Object.keys(GOV)])}</select></div><div><label class="${rq?"rq":""}">المدينة/البلدة</label><select name="${p}q"></select></div><div><label class="${rq?"rq":""}">المنطقة/الحي</label><input name="${p}z"></div></div>`;
async function boot(){
 try{const c=await Promise.race([call({op:"get",c:"meta",id:"config"}),new Promise((_,no)=>setTimeout(()=>no(new Error("t")),12000))]);if(c&&c.exists&&c.data&&c.data.active)year=c.data.active}catch(e){}
 $("#app").innerHTML=`<div class="brand"><img src="${FLAG}" alt=""><img src="${LOGO}" alt=""><small>هذا التطبيق مقدم من مجموعة حجر وبشر - اللجنة السياسية</small></div><div class="card"><h1>تسجيل بيانات الناخب</h1><form id="f"><div class="g">${fld("fn","الاسم الكامل","text")}${fld("ln","الشهرة / العائلة","text")}</div><div class="g">${fld("fa","اسم الأب","text")}${fld("mo","اسم الأم وشهرتها","text")}</div><div class="g">${fld("dob","تاريخ الولادة","date")}${fld("sx","الجنس","text")}</div><div class="g">${fld("sect","الطائفة","text")}${fld("g","الوضع الاجتماعي","text")}</div><div class="g">${fld("nid","رقم الهوية","text")}${fld("reg","رقم القيد","text")}</div>${loc("h","عنوان السكن",true)}<div class="g">${fld("addr","عنوان دقيق","text")}${fld("mob","رقم الهاتف","tel")}</div><div class="g">${fld("job","المهنة","text")}${fld("work","مكان العمل","text")}</div><div class="card"><h3>مستندات/صور</h3><div class="dr"><b>إرفاق صورة الهوية أو إخراج القيد أو أي مستند آخر</b><label class="btn">اختيار ملف<input type="file" accept="image/*,.pdf" data-dt="doc" multiple></label></div><div class="dc">عدد الملفات: <span data-dc="doc">0</span></div><div id="im" class="im"></div></div><div class="msg" id="ag">يرجى التحقق من تار��خ الميلاد</div><div class="msg bad hide" id="em"></div><button class="pr" type="submit">إرسال الطلب</button></form></div>`; wire();}
function wire(){
 const f=$("#f");let blocked=false;
 const chk=()=>{const m=$("#ag");blocked=false;m.classList.add("hide");const dv=f.dob.value;if(dv){const a=age(dv);if(a==null||a<0||a>120){blocked=true;m.textContent="تاريخ الولادة غير صحيح";m.classList.remove("hide");return}if(a<18){blocked=true;m.textContent="يجب أن يكون عمر الناخب 18 سنة فما فوق";m.classList.remove("hide");return}}};
 f.addEventListener("change",e=>{if(e.target.dataset.p){const p=e.target.dataset.p;f[p+"q"].innerHTML=opts(["",...(GOV[e.target.value]||[])]);}if(e.target.name=="dob")chk();});
 f.addEventListener("input",e=>{if(e.target.name=="dob")chk();});
 const um=(t,c)=>{const u=$("#um");if(u){u.textContent=t;u.className="msg "+(c||"")}};
 const draw=()=>{document.querySelectorAll("[data-dc]").forEach(s=>{s.textContent=imgs.filter(m=>m.type==s.dataset.dc).length});$("#im").innerHTML=imgs.map((m,i)=>`<div>${/pdf/.test(m.mime)?`<span class="pdf">PDF</span>`:`<img src="${m.url}" alt="">`}<i data-i="${i}">حذف</i></div>`).join("");};
 $("#im").onclick=e=>{if(e.target.dataset.i){imgs.splice(+e.target.dataset.i,1);draw()}};
 f.querySelectorAll("input.dp").forEach(inp=>{inp.onchange=async e=>{const t=inp.dataset.dt,fl=[...e.target.files];e.target.value="";for(const file of fl){try{um("جارٍ رفع "+file.name+"…"," ");const url=await upload(file,t);imgs.push({type:t,url,mime:file.type,name:file.name});draw();}catch(x){const msg=x&&x.message?x.message:"تعذر رفع الملف";alert(msg);}}}});
 f.querySelectorAll("input[type='file']").forEach(inp=>{inp.onchange=async e=>{const fl=[...e.target.files];e.target.value="";for(const file of fl){try{const url=await upload(file,"doc");imgs.push({type:"doc",url,mime:file.type,name:file.name});draw();}catch(x){const msg=x&&x.message?x.message:"تعذر رفع الملف";alert(msg);}}}});
 const err=t=>{const m=$("#em");m.textContent=t;m.classList.remove("hide")};
 f.onsubmit=async e=>{e.preventDefault();chk();if(blocked)return;const d=Object.fromEntries(new FormData(f)),miss=REQ.filter(([k])=>!String(d[k]||"").trim()).map(x=>x[1]);if(miss.length)return err("يرجى تعبئة الحقول الإلزامية: "+miss.join("، "));if(!imgs.length)return err("إرفاق مستند واحد على الأقل إلزامي (صورة الهوية أو إخراج القيد أو مستند آخر).");const b=$("#sv");if(b)b.disabled=true;$("#em").classList.add("hide");try{const ks=regKeys(d,year);for(const k of ks){const s=await call({op:"get",c:"registry",id:k});if(s&&s.exists){err("⛔ هذا الشخص مسجّل مسبقاً، ولا يمكن إدخال البيانات مرة أخرى.");if(b)b.disabled=false;return;}}for(const k of ks)await call({op:"set",c:"registry",id:k,data:{at:Date.now()}});let uid="";try{uid=localStorage.getItem("uid")||("u"+Date.now().toString(36)+Math.random().toString(36).slice(2,8));localStorage.setItem("uid",uid)}catch(x){}await call({op:"set",c:"submissions",id:"s"+Date.now()+Math.random().toString(36).slice(2,6),data:Object.assign({},d,{imgs:imgs,yr:year,at:Date.now(),by:uid,status:"new"}));$("#app").innerHTML='<div class="card"><h3>✅ تم الإرسال بنجاح، شكراً لك.</h3><div class="msg ok">سيراجع المسؤول طلبك.</div></div>';}catch(x){err("تعذر الإرسال: "+(x.message||x));if(b)b.disabled=false;}};
 chk();
window.addEventListener("error",e=>{const a=$("#app");if(a&&a.children.length==1&&a.firstElementChild.className=="msg")a.innerHTML='<div class="card"><div class="msg bad" id="se"></div><button class="pr" type="button" onclick="location.reload()">إعادة المحاولة</button></div>'});}
boot();
})();
</script></body></html>
